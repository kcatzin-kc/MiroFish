<!doctype html>
<html lang="es">
  <head>
    <script>
      (function () {
        var configured = '__MIROFISH_DEFAULT_LOCALE__'
        var saved = localStorage.getItem('locale') || configured || 'es'
        var prefix = String(saved).toLowerCase().split(/[-_]/)[0]
        var known = { zh: 1, en: 1, es: 1 }
        document.documentElement.lang = known[prefix] ? prefix : 'es'
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@100..800&family=Noto+Sans+SC:wght@300;400;500;700;800;900&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MiroFish - Sistema de simulación de opinión en redes sociales" />
    <title>MiroFish - Predice todo</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
